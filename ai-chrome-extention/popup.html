<!DOCTYPE html>
<html>
<head>
  <title>AI Web Q&A</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Main content (fake editor area) */
    .content {
      flex: 1;
      background: #f0f0f0;
      padding: 20px;
    }

    /* Sidebar */
    .sidebar {
      width: 400px;   /* make it wider */
      background-color: #f8f9fa;
      box-shadow: -2px 0 6px rgba(0,0,0,0.2);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    textarea {
      flex: 0 0 100px;
      resize: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    button {
      background-color: #0078d7;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 15px;
    }

    button:hover {
      background-color: #005fa3;
    }

 #answer {
  flex: 1;
  min-height: 250px;      /* keeps it visible */
  max-height: 400px;      /* optional: cap height so it doesn’t grow forever */
  overflow-y: auto;       /* enables vertical scrolling */
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 10px;
  background-color: #fff;
  font-size: 14px;
}

  </style>
</head>
<body>
  <!-- Main page area -->
  <div class="content">
    <h1>My Main Page Content</h1>
    <p>This area represents your app or webpage (like the editor in VS Code).</p>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Ask AI about this page</h2>
    <textarea id="query" placeholder="Enter your question"></textarea>
    <button id="askBtn">Ask</button>
    <h3>Answer:</h3>
    <div id="answer"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
